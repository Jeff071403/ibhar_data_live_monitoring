services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - DJANGO_SECRET_KEY=production-secret-key-ibhar-monitoring
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DB_ENGINE=sqlite
      - CORS_ALLOW_ALL_ORIGINS=True

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:8080"
      - "3000:8080"
    depends_on:
      - backend
